[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teramount-analysis"
version = "1.0.0"
description = "Labeling and metrology of the Pivot and Xpander elements in 3D topography scans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[project.scripts]
teramount-analysis = "teramount_analysis.cli:main"

[tool.setuptools]
packages = ["teramount_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "realdata: needs the provided .npy datasets",
    "slow: takes more than ~10 s",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
